name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type Check, Validate, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run type-check
      
      - name: Generate SSR artifacts
        run: npm run generate:ssr
      
      - name: Validate architecture
        run: npm run validate
      
      - name: Unit + Integration + Security tests
        run: npm run test
      
      - name: Build production
        run: npm run build
