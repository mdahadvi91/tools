name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type Check, Validate, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run type-check
      
      - name: Generate SSR artifacts
        run: npm run generate:ssr
      
      - name: Validate architecture
        run: npm run validate
      
      - name: Build production
        run: npm run build
      
      - name: Check for generated file drift
        run: |
          if [[ -n $(git status --porcelain functions/ public/sitemap.xml public/robots.txt public/images/og/) ]]; then
            echo "❌ Generated files are out of date. Run 'npm run build' locally and commit."
            git status --porcelain functions/ public/sitemap.xml public/robots.txt public/images/og/
            exit 1
          fi
          echo "✅ Generated files are in sync."
