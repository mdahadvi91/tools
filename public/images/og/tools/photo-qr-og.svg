<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0A1024" />
          <stop offset="100%" stop-color="#2D1B2E" />
        </linearGradient>
        <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#D88B9A" />
          <stop offset="100%" stop-color="#C99667" />
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#bg)" />
      
      <!-- Decorative circles -->
      <circle cx="100" cy="100" r="300" fill="#D88B9A" opacity="0.1" filter="blur(40px)" />
      <circle cx="1100" cy="550" r="250" fill="#C99667" opacity="0.1" filter="blur(40px)" />
      
      <!-- Main Content -->
      <text x="80" y="200" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="url(#text-glow)">Photo QR Code</text>
      <text x="80" y="280" font-family="system-ui, sans-serif" font-size="32" fill="#a0a0a0">Add a real, scannable QR badge to any photo — WhatsApp, Facebook, WiFi, and more.</text>
      
      <!-- Footer / Branding -->
      <text x="80" y="550" font-family="system-ui, sans-serif" font-weight="bold" font-size="40" fill="#ffffff">AHADEX Tools</text>
      <text x="80" y="590" font-family="system-ui, sans-serif" font-size="24" fill="#666">ahadex.online</text>
      
      <!-- Tool Icon Placeholder -->
      <rect x="900" y="100" width="200" height="200" rx="40" fill="#ffffff" opacity="0.05" />
      <text x="1000" y="220" font-family="system-ui, sans-serif" font-size="80" text-anchor="middle" fill="#D88B9A">📱</text>
    </svg>